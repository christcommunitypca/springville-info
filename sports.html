<style>
*{box-sizing:border-box}
:root{--ink:#17354a;--muted:#547081;--teal:#346e64;--blue:#164c73;--red:#9d443e;--line:#d8e4e9;--paper:#f5f9fa;--white:#fff}
html{background:var(--paper);color:var(--ink)}
body{max-width:1260px;margin:0 auto;padding:0 clamp(14px,3vw,38px) 45px;font:500 16px/1.5 "DM Sans",-apple-system,sans-serif}
a{color:inherit;text-underline-offset:3px} button,select{font:inherit}
a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #d57d42;outline-offset:3px}
[hidden]{display:none!important}
.masthead{margin:0 calc(0px - clamp(14px,3vw,38px)) 23px;padding:18px clamp(16px,5vw,62px) 25px;background:linear-gradient(112deg,#113a55 0%,#1c5664 70%,#427e77 100%);border-bottom:6px solid #bd654c;color:white;position:relative;overflow:hidden}
.masthead:after{content:"";position:absolute;right:-100px;top:-90px;width:380px;height:380px;border:28px solid rgba(255,255,255,.08);border-radius:50%;box-shadow:0 0 0 40px rgba(255,255,255,.045);pointer-events:none}
.back{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;font-weight:700;text-decoration:none;color:#d9f1ed}
.eyebrow{display:flex;align-items:center;gap:11px;margin:17px 0 1px;color:#d9e8e8;text-transform:uppercase;letter-spacing:.18em;font-size:.73rem;font-weight:800}
.tiger-mark{display:inline-grid;place-items:center;width:36px;height:36px;border:2px solid rgba(255,255,255,.75);border-radius:10px;font:800 1.8rem/1 "Barlow Condensed",sans-serif;letter-spacing:-.07em;transform:rotate(-5deg)}
h1,h2,h3,p{margin-top:0}
h1{margin:8px 0 3px;font:800 clamp(2.7rem,7vw,5rem)/.96 "Barlow Condensed",Impact,sans-serif;letter-spacing:.006em;text-transform:uppercase}
.masthead p{max-width:640px;margin:9px 0 0;color:#f0f6f5;font-size:.94rem}
.toolbar{padding:18px;background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 30px rgba(23,53,74,.035)}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.month-buttons{display:flex;align-items:center;gap:9px}
.month-buttons button{width:37px;height:37px;border-radius:9px;border:1px solid #b5cbd2;background:#edf4f5;color:var(--ink);cursor:pointer;font-size:1.3rem}
.month-buttons button:hover{background:#dceced}
#month-label{margin:0;min-width:205px;font:800 clamp(1.5rem,3vw,2rem)/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.today-button{width:auto!important;padding:0 12px;font:700 .84rem "DM Sans",sans-serif!important}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.field{display:flex;flex:1 1 170px;flex-direction:column;gap:5px}
.field label,.field-label{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:#466674}
.field select{width:100%;min-height:46px;padding:0 12px;border-radius:9px;background:#f8fbfc;border:1px solid #a8c2cd;color:var(--ink);font-size:1rem}
.calendar-note{display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 1px 13px;color:#526e78;font-size:.9rem}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:0 0 8px;text-align:center}
.weekdays span{padding:4px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:#4c6a73;font-weight:800}
#month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:stretch;gap:8px}
.calendar-day,.calendar-gap{min-height:131px;border-radius:11px}
.calendar-day{background:#fff;border:1px solid var(--line);padding:9px;min-width:0}
.calendar-gap{background:#edf3f4;border:1px dashed #d8e4e9}
.calendar-day.is-today{border:2px solid var(--teal);padding:8px}
.calendar-day h3{display:flex;align-items:center;gap:5px;margin:0 0 8px;color:#1d5270;font:800 1.05rem "DM Sans",sans-serif}
.calendar-day h3 small{font-size:.53rem;text-transform:uppercase;letter-spacing:.07em;color:var(--teal)}
.game{display:flex;flex-direction:column;gap:4px;min-width:0;margin-bottom:6px;padding:9px 10px;background:#e7f0f1;border-left:3px solid var(--teal);border-radius:7px;text-decoration:none;transition:background .15s}
.game:hover{background:#d6e7e9}
.game.completed{background:#f9eae4;border-color:var(--red)}
.game.completed:hover{background:#f4dad0}
.game-meta{font-size:.79rem;text-transform:uppercase;letter-spacing:.055em;color:#4b6671;font-weight:800}
.matchup{font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.game-result{font-size:1rem;color:#2e6271}
.game-time{font-weight:700;color:#215c63}
.final-tag{display:inline-block;padding:2px 5px;margin-right:5px;border-radius:4px;background:#8e3c34;color:#fff;font-size:.58rem;text-transform:uppercase;letter-spacing:.04em;font-weight:800;vertical-align:middle}
.score{display:block;margin-top:3px;line-height:1.25;font-size:1rem;color:#74332d}
.status-tag{font-weight:800;text-transform:capitalize;color:#935a24}
#agenda-list{display:flex;flex-direction:column;gap:16px}
.agenda-day{background:white;border:1px solid var(--line);border-radius:13px;padding:14px}
.agenda-day h3{margin:0 0 11px;font:800 1.4rem "Barlow Condensed",sans-serif;letter-spacing:.03em;text-transform:uppercase}
.agenda-day .game{padding:14px;margin:0 0 9px;gap:7px}
.agenda-day .game:last-child{margin-bottom:0}
.agenda-day .game-meta{font-size:.83rem}
.agenda-day .matchup{font-size:1.12rem}
.agenda-day .game-result{font-size:1rem}
.agenda-day .score{font-size:1rem}
.empty{padding:20px;color:#5c7180;background:white;border:1px dashed var(--line);border-radius:12px;max-width:700px}
.source-note{max-width:800px;margin-top:25px;padding-top:16px;border-top:1px solid var(--line);color:#516978;font-size:.92rem}
.source-note p{margin-bottom:8px}
footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:#46616e}
@media(max-width:1000px){.weekdays,#month-grid{gap:5px}.calendar-day{padding:6px}.game{padding:6px}.game-meta{font-size:.76rem}.matchup{font-size:.95rem}.score{font-size:.9rem}}
@media(max-width:760px){body{padding-bottom:26px}.masthead{margin-bottom:16px;padding-bottom:22px}.eyebrow{margin-top:15px}h1{font-size:3.3rem}.toolbar{padding:14px}.topline{gap:12px}.month-buttons{flex:1;flex-wrap:wrap}.month-buttons #month-label{min-width:135px;flex:1}.view{margin-left:auto}.field{flex-basis:125px}.weekdays{display:none}.calendar-note{margin-top:15px}.agenda-day{padding:12px}.source-note{margin-top:16px}}

/* Simplified schedule: only a vertical list, with prominent W/L and compact verified score. */
.final-result,.live-result{display:flex;align-items:center;gap:12px;min-width:0}
.outcome{display:grid;place-items:center;flex:none;width:50px;height:50px;border-radius:10px;font:800 2.2rem/1 "Barlow Condensed",Impact,sans-serif}
.outcome-w{color:#fff;background:#286e54}
.outcome-l{color:#fff;background:#9d443e}
.outcome-t{color:#17354a;background:#dce7e7}
.live-tag{display:inline-block;flex:none;padding:5px 8px;border-radius:6px;background:#b53e29;color:#fff;font-size:.75rem;font-weight:800;letter-spacing:.05em}
.agenda-day .game .score{display:inline-block;margin:0;color:#17354a;font-size:1.1rem;font-weight:800;line-height:1.35}
.agenda-day .game.completed{background:#fff9f6;border-color:#9c7160}
.agenda-day .game.completed:hover{background:#f8ece5}
@media(max-width:760px){.final-result,.live-result{gap:12px}.outcome{width:50px;height:50px}.agenda-day .game .score{font-size:1.06rem}}


/* Keep the Tigers Sports masthead; omit only the supporting eyebrow and description. */
.masthead{position:relative;margin:0 calc(0px - clamp(14px,3vw,38px)) 23px;padding:18px clamp(16px,5vw,62px) 25px;min-height:0;background:linear-gradient(112deg,#113a55 0%,#1c5664 70%,#427e77 100%);border-bottom:6px solid #bd654c;overflow:hidden;color:white}
.masthead:after{display:block}
.masthead .back{position:relative;z-index:1;color:#d9f1ed;font-size:.84rem}
.masthead h1{position:relative;z-index:1;margin:12px 0 3px;font:800 clamp(2.7rem,7vw,5rem)/.96 "Barlow Condensed",Impact,sans-serif;letter-spacing:.006em;text-transform:uppercase}
.masthead-title{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin-top:12px}
.masthead-title h1{margin:0}
.masthead-title .tiger-mark{flex:0 0 48px;width:48px;height:48px;border:2px solid rgba(255,255,255,.85);border-radius:12px;color:white;font:800 2.3rem/1 "Barlow Condensed",Impact,sans-serif;transform:rotate(-5deg)}
@media(max-width:480px){.masthead-title{gap:11px}.masthead-title .tiger-mark{flex-basis:42px;width:42px;height:42px;font-size:2rem}.masthead-title h1{font-size:clamp(2.35rem,10vw,3.3rem)}}

/* The hidden width guide gives every month the exact same label space.
   The next arrow is immediately after the longest month, and never shifts. */
.topline{justify-content:flex-start}
.month-buttons{display:inline-flex;flex:0 0 auto;align-items:center;gap:5px;width:max-content;max-width:100%;flex-wrap:nowrap}
.month-label-slot{display:grid;align-items:center;justify-items:center;flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.month-label-slot .month-measure,.month-label-slot #month-label{grid-area:1/1;font:800 clamp(1.4rem,3vw,2rem)/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:0;white-space:nowrap}
.month-label-slot .month-measure{visibility:hidden;pointer-events:none}
.month-label-slot #month-label{margin:0;min-width:0;width:auto;padding:0;text-align:center;justify-self:center}
.month-buttons .today-button{margin-left:5px}

/* A real, three-stop range slider: drag the single circular thumb or tap a stop. */
.filters{align-items:flex-end;gap:12px}
.filters .field:first-child{flex:1 1 160px;min-width:112px}
.team-field{flex:0 0 170px;width:170px;min-width:0;align-self:flex-end}
.gender-slider-wrap{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:42px;width:100%;padding:0 0 1px}
.gender-slider-rail{position:relative;display:block;width:100%;height:24px}
.gender-slider{position:relative;z-index:2;display:block;width:100%;height:24px;margin:0;padding:0;appearance:none;-webkit-appearance:none;outline-offset:2px;background:transparent;cursor:pointer;touch-action:pan-y}
.gender-slider::-webkit-slider-runnable-track{height:3px;border-radius:6px;background:#93afbb}
.gender-slider::-moz-range-track{height:3px;border-radius:6px;background:#93afbb}
.gender-slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;box-sizing:border-box;width:18px;height:18px;margin-top:-7.5px;border:3px solid white;border-radius:50%;background:#174e73;box-shadow:0 0 0 1px #174e73,0 2px 5px #17354a33;cursor:grab}
.gender-slider::-moz-range-thumb{box-sizing:border-box;width:18px;height:18px;border:3px solid white;border-radius:50%;background:#174e73;box-shadow:0 0 0 1px #174e73,0 2px 5px #17354a33;cursor:grab}
.gender-slider:active::-webkit-slider-thumb{cursor:grabbing}
.gender-track-stops{position:absolute;z-index:1;left:6px;right:6px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.gender-track-stops i{display:block;width:6px;height:6px;border-radius:50%;background:#7b9ba7}
.gender-stop-labels{display:flex;justify-content:space-between;align-items:center;gap:2px;padding-top:0}
.gender-stop{display:inline-block;flex:0 0 auto;margin:0;padding:0 1px;border:0;background:none;color:#526978;font:650 .85rem/1.35 "DM Sans",sans-serif;cursor:pointer;min-height:22px}
.gender-stop:hover,.gender-stop[aria-current="true"]{color:var(--blue);font-weight:800}
.gender-stop:focus-visible{outline:2px solid #d57d42;outline-offset:3px}
@media(max-width:760px){
 .masthead{margin-bottom:16px;padding-top:16px}
 .topline{flex-wrap:nowrap}
 .month-buttons{flex:0 0 auto;gap:4px;flex-wrap:nowrap}
 .month-label-slot .month-measure,.month-label-slot #month-label{font-size:clamp(1.45rem,5vw,1.8rem)}
 .team-field{flex:0 0 165px;width:165px}
}
@media(max-width:380px){
 .month-buttons{gap:3px}
 .month-buttons button{width:32px;height:36px}
 .month-label-slot .month-measure,.month-label-slot #month-label{font-size:1.38rem}
 .month-buttons .today-button{padding:0 7px!important;margin-left:1px;font-size:.76rem!important}
 .filters{gap:8px}
 .team-field{flex-basis:146px;width:146px}
 .filters .field:first-child{min-width:105px}
}

/* Easy-to-scan scores: away above home; winner bold, loser gently muted. */
.agenda-day .game .score{font-weight:500;min-width:0;flex:1}
.score-lines{display:flex;flex-direction:column;gap:3px;width:100%;min-width:0}
.score-line{display:grid;grid-template-columns:3ch minmax(0,1fr);column-gap:0;align-items:baseline;line-height:1.35}
.score-points{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";text-align:left;white-space:nowrap}
.score-team-name{overflow-wrap:anywhere}
.score-winner{font-weight:800;color:#17354a}
.score-loser{font-weight:500;color:#647783}
.score-tie{font-weight:650;color:#27485a}
.preferred-score-game .score{color:inherit}

/* Meets and tournaments show placements, team scores, PRs, and highlights without W/L badges. */
.agenda-day .competition-card{gap:6px}
.meet-title{display:block;font-size:1.14rem;line-height:1.25}
.meet-venue{font-size:.83rem;color:#587280}
.agenda-day .competition-card .meet-summary{font-size:1.08rem;line-height:1.3;font-weight:800;color:#245b50}
.meet-highlights{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.meet-highlight{display:inline-block;border-radius:6px;border:1px solid #cfdfdf;background:#edf4f3;padding:3px 8px;font-size:.83rem;font-weight:650;color:#305867}
.set-caption{display:block;font-size:.78rem;font-weight:600;color:#617781}

/* Cross country: always show three fastest Springville finishers, then all verified PRs. */
.xc-section{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:10px;border-top:1px solid #d5e1e2}
.xc-section-heading{font-size:.75rem;text-transform:uppercase;font-weight:800;letter-spacing:.065em;color:#446773;margin-bottom:2px}
.xc-runner{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px;row-gap:1px;padding:3px 0;line-height:1.35;font-size:.89rem}
.xc-rank,.xc-pr-mark{display:inline-grid;place-items:center;flex:none;min-width:24px;height:22px;padding:0 4px;border-radius:5px;font:800 .75rem/1 "DM Sans",sans-serif;background:#dde9e9;color:#285965}
.xc-pr-mark{background:#dcefe3;color:#236044;font-size:.64rem}
.xc-runner-name{font-weight:750;color:#17354a}
.xc-runner-stat{color:#4e6d78;font-variant-numeric:tabular-nums}
.xc-achievements{display:flex;flex-direction:column;gap:5px;margin-top:9px;padding-top:9px;border-top:1px solid #d5e1e2}
.xc-achievement{font-size:.87rem;color:#2b6959;font-weight:700}

/* Calendar = team outcome; individual achievements live on the shareable details page. */
.agenda-day .competition-card {gap:7px}
.agenda-day .competition-card .meet-title {font-size:1.14rem}
.placement-row {display:flex;align-items:center;gap:12px;min-width:0}
.outcome-placement {background:#21685d;color:#fff;font-size:1.95rem;min-width:50px;font-variant-numeric:tabular-nums}
.placement-context {font-weight:750;color:#365e68;font-size:1rem;line-height:1.3;overflow-wrap:anywhere}
.card-bottom {display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:22px;margin-top:2px}
.pr-indicator {display:inline-flex;align-items:center;gap:3px;border:1px solid #b5d8d1;border-radius:20px;background:#e9f5f2;color:#246451;font-size:.76rem;font-weight:800;line-height:1.2;padding:4px 9px;white-space:nowrap}
.pr-spark {font-size:.93rem;line-height:1}
.details-hint {display:block;width:max-content;margin-left:auto;color:#607c86;font-size:.78rem;font-weight:700;line-height:1.4}
.details-arrow {font-size:1.15rem;vertical-align:-.035em}
.game:hover .details-hint,.game:focus-visible .details-hint {color:#17354a}
@media(max-width:760px) {
  .agenda-day .competition-card {padding:11px 12px}
  .placement-row {gap:10px}
  .placement-context {font-size:.95rem}
  .agenda-day .competition-card .meet-title {font-size:1.08rem}
}


.schedule-status{margin:8px 0 16px;padding:12px 14px;background:#eef5f6;border:1px solid #ccdedf;border-radius:10px;color:#375c66;font-size:.86rem;line-height:1.5}
.schedule-status a{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.record-note{display:inline-flex;align-items:center;gap:7px;width:max-content;margin-top:6px;padding:3px 8px;border:1px solid #d4e3e5;border-radius:6px;background:#f0f5f5;color:#3e626c;font-weight:700;font-size:.77rem;line-height:1.35;font-variant-numeric:tabular-nums}
.record-note strong{color:#173e50;font-size:.84rem}

</style>
