<style>
*{box-sizing:border-box}
:root{--ink:#17354a;--muted:#547081;--teal:#346e64;--line:#d8e4e9;--paper:#f5f9fa;--red:#9d443e}
html{background:var(--paper);color:var(--ink)}
body{max-width:1050px;margin:0 auto;padding:0 clamp(14px,3vw,38px) 45px;font:500 16px/1.5 "DM Sans",-apple-system,sans-serif}
a{color:inherit;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid #d57d42;outline-offset:3px}
.masthead{margin:0 calc(0px - clamp(14px,3vw,38px)) 20px;padding:18px clamp(16px,5vw,62px) 22px;background:linear-gradient(112deg,#113a55 0%,#1c5664 70%,#427e77 100%);border-bottom:6px solid #bd654c;color:#fff}
.back{display:inline-flex;text-decoration:none;font-size:.84rem;font-weight:750;color:#d9f1ed}
.brand{display:flex;align-items:center;gap:12px;margin-top:14px;font:800 clamp(1.8rem,5vw,2.7rem)/1 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase}
.tiger-mark{display:inline-grid;place-items:center;width:39px;height:39px;flex:0 0 39px;border:2px solid rgba(255,255,255,.8);border-radius:10px;font:800 1.8rem "Barlow Condensed",sans-serif;transform:rotate(-5deg)}
.detail-shell{background:#fff;border:1px solid var(--line);border-radius:15px;padding:clamp(18px,4vw,36px);box-shadow:0 6px 24px rgba(23,53,74,.035)}
.category{margin:0 0 9px;color:#456977;font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
h1{font:800 clamp(2rem,5vw,3.3rem)/1.02 "Barlow Condensed",Impact,sans-serif;letter-spacing:.005em;margin:0 0 9px}
.when{margin:0;color:#587582;font-size:.94rem}
.title-row{display:flex;justify-content:space-between;align-items:start;gap:16px}
.share{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 13px;border:1px solid #bad0d6;border-radius:9px;background:#edf5f6;color:#173e55;font:750 .86rem "DM Sans",sans-serif;cursor:pointer}
.share:hover{background:#dbeaed}
.share-status{min-height:1.2em;color:#446d61;font-size:.78rem;margin-top:3px}
.result-panel{margin-top:22px;padding:17px 19px;background:#f2f7f6;border-left:4px solid #3b7770;border-radius:11px}
.result-label{display:block;margin-bottom:6px;color:#466977;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.result-strip{display:flex;align-items:center;gap:14px;min-height:54px}
.result-box{flex:none;display:grid;place-items:center;min-width:54px;height:54px;padding:0 5px;border-radius:10px;background:#22665a;color:white;font:800 2.15rem/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.result-box.win{background:#286e54}.result-box.loss{background:#9d443e}.result-box.tie{background:#17354a}
.result-context{font-size:1.13rem;line-height:1.3;font-weight:800;color:#315d67}
.result-detail{display:block;margin-top:3px;color:#617a82;font-size:.89rem;font-weight:600}
.score-lines{display:flex;flex-direction:column;gap:4px}
.score-line{display:grid;grid-template-columns:3ch minmax(0,1fr);column-gap:5px;align-items:baseline}
.score-points{font-variant-numeric:tabular-nums;text-align:left}
.winner{font-weight:850}.loser{font-weight:500;color:#637b83}
.note{margin-top:10px;color:#526b75;font-size:.87rem}
section.group{margin-top:25px;padding-top:21px;border-top:1px solid #dce7e9}
h2{margin:0 0 12px;font:800 1.65rem/1.1 "Barlow Condensed",Impact,sans-serif;letter-spacing:.025em}
.subtext{font-size:.85rem;color:#526f7d;margin:-4px 0 11px}
.runner-list,.player-list{display:flex;flex-direction:column;gap:3px}
.runner,.player{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #e8efef;font-size:.96rem;line-height:1.36}
.runner:last-child,.player:last-child{border:0}
.rank,.pr{flex:none;display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 4px;border-radius:6px;background:#e2eeef;color:#315d68;font-weight:850;font-size:.75rem}
.pr{background:#dcefe3;color:#236044;font-size:.65rem}
.runner-name,.player-name{font-weight:750}
.runner-stat,.player-stat{margin-left:auto;color:#4c6d79;font-variant-numeric:tabular-nums}
.player-stat{font-weight:600}
.extra-list{margin:0;padding-left:20px;color:#355d66}
.extra-list li{padding:4px 0}
.sources{margin-top:28px;padding-top:15px;border-top:1px solid #dce7e9;color:#516d78;font-size:.89rem}
.sources p{margin:0 0 8px}
.sources a{color:#1b5d71;font-weight:750}
.state-message{padding:20px;background:white;border:1px dashed #bdd1d8;border-radius:10px}
.footer{font-size:.84rem;color:#546e79;margin-top:20px;padding-top:14px;border-top:1px solid #dce7e9}
@media(max-width:610px){
.title-row{flex-wrap:wrap}
.share{min-height:34px;padding:6px 12px}
.runner-stat,.player-stat{margin-left:38px;width:calc(100% - 38px)}
.result-context{font-size:1.02rem}
.result-strip{gap:11px}
.result-panel{padding:14px}
}
.verified-record{margin-top:14px;padding-top:12px;border-top:1px solid #d0e2df;color:#426a68;font-size:.92rem;font-weight:700;font-variant-numeric:tabular-nums}
.verified-record strong{font-weight:850;color:#1d574d;font-size:1.06rem}
</style>
